<!doctype html>
<!--
  Nova Cash · Correo de confirmación de registro (R-11).
  Supabase → Authentication → Email Templates → "Confirm signup".
  Asunto: Confirma tu cuenta de Nova Cash
-->
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #eef4ff;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #eef4ff; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border-radius: 24px;
              overflow: hidden;
              box-shadow: 0 12px 40px -8px rgba(15, 23, 42, 0.18);
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #0f172a 0%, #2563eb 55%, #06b6d4 100%);
                  background-color: #2563eb;
                  padding: 32px 24px;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #ffffff;
                    letter-spacing: -0.3px;
                  "
                >
                  NovaCash
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 28px 8px; text-align: center">
                <div
                  style="
                    display: inline-block;
                    width: 64px;
                    height: 64px;
                    line-height: 64px;
                    border-radius: 999px;
                    background: #e6f0ff;
                    font-size: 32px;
                  "
                >
                  👋
                </div>
                <h1 style="margin: 20px 0 8px; font-size: 22px; line-height: 30px; color: #0f172a">
                  ¡Bienvenido a Nova Cash!
                </h1>
                <p style="margin: 0; font-size: 16px; line-height: 24px; color: #475569">
                  Confirma tu correo <strong style="color: #0f172a">{{ .Email }}</strong> para
                  activar tu cuenta y empezar a comprender tu dinero.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 28px; text-align: center">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #0f172a;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 16px;
                    font-weight: 600;
                    padding: 16px 32px;
                    border-radius: 16px;
                  "
                  >Confirmar mi cuenta</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 0 28px 28px; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 18px;
                    color: #94a3b8;
                    word-break: break-all;
                  "
                >
                  Si el botón no funciona, copia este enlace: {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 28px; background: #f8fafc; text-align: center">
                <p style="margin: 0; font-size: 12px; color: #94a3b8">
                  Si no creaste una cuenta en Nova Cash, ignora este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
